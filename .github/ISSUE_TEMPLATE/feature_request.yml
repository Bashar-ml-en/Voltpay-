name: Feature Request
description: Suggest an idea or enhancement for VaultPay
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for proposing a feature for VaultPay!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain Area
      options:
        - Autonomous Agent Capabilities
        - Model Context Protocol (MCP) Tools
        - Hardware TEE Enclave Security
        - Cryptographic Ledger Auditing
        - Financial Settlement Rails
    validations:
      required: true
